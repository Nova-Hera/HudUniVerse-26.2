name: HudUniVerse
version: '1.3.1'
main: br.com.universe.hud.HudUniVersePlugin
description: UniVerse HUD integration for Paper 26.2 with Towny location/ownership separation
author: UniVerse
api-version: '26.2'
depend:
  - PlaceholderAPI
softdepend:
  - Towny
  - AuraSkills
  - RealisticSeasons
  - TAB
commands:
  huduniverse:
    description: HudUniVerse administration
    usage: /huduniverse <status|test|reload>
    permission: huduniverse.admin
permissions:
  huduniverse.admin:
    description: Manage HudUniVerse
    default: op
